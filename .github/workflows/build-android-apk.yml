name: Build Mutation Case Simulator APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "a_vibrant_high_detail_fantasy_digital_illustratio.png"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install JavaScript dependencies
        run: npm install

      - name: Prepare game files
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f a_vibrant_high_detail_fantasy_digital_illustratio.png ]; then
            cp a_vibrant_high_detail_fantasy_digital_illustratio.png www/
          fi

      - name: Generate Android project
        run: npx cap add android

      - name: Sync game into Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mutation-Case-Simulator-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
